<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frontend Mentor | Product preview card component</title>
    <link rel="shortcut icon" href="images/favicon-32x32.png" type="image/x-icon">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="container">
        <div class="product-picture">
            <img src="images/image-product-desktop.jpg" alt="product image" class="desktop-pic">
            <img src="images/image-product-mobile.jpg" alt="product image" class="mobile-pic">
        </div>
        <div class="product-details">
            <div class="product-type">
                PERFUME
            </div>
            <div class="product-name">
                <h1>
                    Gabrielle Essence Eau De Parfum
                </h1>    
            </div>
            <div class="product-description">
                <p>
                    A floral, solar and voluptuous interpretation composed by Olivier Polge, 
                    Perfumer-Creator for the House of CHANEL.
                </p>
            </div>
            <div class="product-price">
                <div class="current-price">
                    <h1>$149.99</h1>
                </div>
                <div class="old-price">
                    $169.99
                </div>
            </div>
            <button class="add-to-cart">
                    <div class="cart-div"><img src="images/icon-cart.svg" alt="cart icon" class="cart-icon"></div>
                    <div>
                        Add to Cart
                    </div>
            </button>
        </div>
    </main>
    <footer class="attribution">
        Challenge by <a href="frontendmentor.io" target="_blank">Frontend Mentor</a>.
        Coded by <a href="https://github.com/justcallmeea" target="_blank">Asamoah</a>.
    </footer>
</body>
</html>
