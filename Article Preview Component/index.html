<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="styles.css" />
    <script defer src="script.js"></script>

    <title>Frontend Mentor | Article preview component</title>

    <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
    <!-- <style>
    .attribution { font-size: 11px; text-align: center; }

  </style> -->
  </head>
  <body>
    <main>
      <div class="image-container">
        <img
          class="main-pic"
          src="images/drawers.jpg"
          alt="Image of a green table with a brown vase with flowers and a picture frame sitting on top of it."
        />
      </div>
      <div class="details">
        <div class="article-section">
          <p class="heading">
            Shift the overall look and feel by adding these wonderful touches to
            furniture in your home
          </p>
          <p class="subtext">
            Ever been in a room and felt like something was missing? Perhaps it
            felt slightly bare and uninviting. I’ve got some simple tips to help
            you make any room feel complete.
          </p>
        </div>
        <!-- <div class="author-section author-section-clicked">
          <div class="author-profile social-media-links">
            <div class="share-text">
              <p>SHARE</p>
            </div>
            <div class="social-media-links">
              <img src="images/icon-facebook.svg" alt="Facebook icon" />
              <img src="images/icon-twitter.svg" alt="Twitter icon" />
              <img src="images/icon-pinterest.svg" alt="Pinterest icon" />
            </div>
          </div>
          <button class="share-btn btn-clicked">
            <img
              class="share-icon"
              src="images/icon-share.svg"
              alt="Share icon"
            />
          </button>
        </div> -->
        <div class="author-section">
          <div class="author-profile">
            <div class="pfp-container">
              <img
                class="pfp"
                src="images/avatar-michelle.jpg"
                alt="A picture of the author of the article"
              />
            </div>
            <div>
              <div class="author-name">Michelle Appleton</div>
              <div class="publish-date">28 Jun 2020</div>
            </div>
          </div>
          <button class="share-btn">
            <img src="images/icon-share.svg" alt="Share icon" />
          </button>
        </div>
      </div>
    </main>
