<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="styles.css" />
    <script defer src="script.js"></script>

    <title>Frontend Mentor | Time tracking dashboard</title>
  </head>
  <body>
    <main class="container">
      <div class="usercard">
        <div class="usercard__details">
          <div class="usercard__imageholder">
            <img
              class="usercard__image"
              src="images/image-jeremy.png"
              alt="Image of user"
            />
          </div>
          <div class="usercard__block">
            <div class="usercard__report">Report for</div>
            <div class="usercard__name">Jeremy Robson</div>
          </div>
        </div>
        <div class="usercard__sort-level">
          <p class="usercard__daily">Daily</p>
          <p class="usercard__weekly active">Weekly</p>
          <p class="usercard__monthly">Monthly</p>
        </div>
      </div>
      <div class="card card--work">
        <div class="card__imageholder">
          <img
            class="card__image"
            src="images/icon-work.svg"
            alt="Icon of a briefcase"
          />
        </div>
        <div class="card__details">
          <div class="card__type active">Work</div>
          <div class="card__elipses">
            <img
              class="card__elipses-img"
              src="images/icon-ellipsis.svg"
              alt="Ellipsis icon"
            />
          </div>
          <div class="card__time active">32hrs</div>
          <div class="card__sort-level">Last Week - 36hrs</div>
        </div>
      </div>
      <div class="card card--play">
        <div class="card__imageholder">
          <img
            class="card__image"
            src="images/icon-play.svg"
            alt="Icon of a controller"
          />
        </div>
        <div class="card__details">
          <div class="card__type active">Play</div>
          <div class="card__elipses">
            <img
              class="card__elipses-img"
              src="images/icon-ellipsis.svg"
              alt="Ellipsis icon"
            />
          </div>
          <div class="card__time active">10hrs</div>
          <div class="card__sort-level">Last Week - 8hrs</div>
        </div>
      </div>
      <div class="card card--study">
        <div class="card__imageholder">
          <img
            class="card__image"
            src="images/icon-study.svg"
            alt="Icon of an open book"
          />
        </div>
        <div class="card__details">
          <div class="card__type active">Study</div>
          <div class="card__elipses">
            <img
              class="card__elipses-img"
              src="images/icon-ellipsis.svg"
              alt="Ellipsis icon"
            />
          </div>
          <div class="card__time active">4hrs</div>
          <div class="card__sort-level">Last Week - 7hrs</div>
        </div>
      </div>
      <div class="card card--exercise">
        <div class="card__imageholder">
          <img
            class="card__image"
            src="images/icon-exercise.svg"
            alt="Icon of an open book"
          />
        </div>
        <div class="card__details">
          <div class="card__type active">Exercise</div>
          <div class="card__elipses">
            <img
              class="card__elipses-img"
              src="images/icon-ellipsis.svg"
              alt="Ellipsis icon"
            />
          </div>
          <div class="card__time active">4hrs</div>
          <div class="card__sort-level">Last Week - 5hrs</div>
        </div>
      </div>
      <div class="card card--social">
        <div class="card__imageholder">
          <img
            class="card__image"
            src="images/icon-social.svg"
            alt="Icon of a text bubble"
          />
        </div>
        <div class="card__details">
          <div class="card__type active">Social</div>
          <div class="card__elipses">
            <img
              class="card__elipses-img"
              src="images/icon-ellipsis.svg"
              alt="Ellipsis icon"
            />
          </div>
          <div class="card__time active">5hrs</div>
          <div class="card__sort-level">Last Week - 10hrs</div>
        </div>
      </div>
      <div class="card card--self-care">
        <div class="card__imageholder">
          <img
            class="card__image"
            src="images/icon-self-care.svg"
            alt="Icon of a heart"
          />
        </div>
        <div class="card__details">
          <div class="card__type active">Self Care</div>
          <div class="card__elipses">
            <img
              class="card__elipses-img"
              src="images/icon-ellipsis.svg"
              alt="Ellipsis icon"
            />
          </div>
          <div class="card__time active">2hrs</div>
          <div class="card__sort-level">Last Week - 2hrs</div>
        </div>
      </div>

      <!-- <div class="attribution">
        Challenge by
        <a href="https://www.frontendmentor.io?ref=challenge" target="_blank"
          >Frontend Mentor</a
        >. Coded by <a href="#">Your Name Here</a>.
      </div> -->
    </main>
  </body>
</html>
